<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Code Game</title>
    <link rel="stylesheet" href="st.css">
</head>
<body>
    <div id="game-container">
        <h1>Crack the code!</h1>
        <p>Guess the secret numeric code in 8 moves</p>
        <div id="input-area">
            <input id="guess-input" type="text" placeholder="Enter your guess">
            <button onclick="guess()">Submit</button>
        </div>
        <p id="hint"></p>
        <p id="feedback"></p>
        <p id="moves-left"></p>
        <div id="history"></div> <!-- Move history will appear here -->
        <button onclick="startgame()">Start New Game</button>
    </div>
    <script src="js1.js"></script>
</body>
</html>
